<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>REMIX BET</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ffd400;
      color: #003399;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    button {
      background: #003399;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 0;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    .match {
      background: white;
      margin: 15px 0;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .teams {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .status {
      color: #555;
      margin-bottom: 10px;
    }

    .analyse {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      color: #555;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚽ REMIX BET</h1>
    <p>Football • Analyses • Matchs</p>
  </header>

  <div class="container">

    <div>
      <h2>Bienvenue sur REMIX BET</h2>

      <p>
        Consultez les matchs de football et préparez vos analyses.
      </p>

      <button onclick="chargerMatchs()">
        🔄 Charger les matchs
      </button>

      <div id="matches">
        <p>Appuyez sur le bouton pour afficher les matchs.</p>
      </div>
    </div>

  </div>

  <footer>
    REMIX BET © 2026
  </footer>

<script>

  async function chargerMatchs() {

    const zone = document.getElementById("matches");

    zone.innerHTML = "<p>🔄 Chargement des matchs...</p>";

    try {

      const response = await fetch("data/fixtures.json");

      if (!response.ok) {
        throw new Error("Impossible de charger les matchs");
      }

      const data = await response.json();

      const matchs = data.response || [];

      if (matchs.length === 0) {

        zone.innerHTML =
          "<p>Aucun match trouvé pour aujourd'hui.</p>";

        return;
      }

      zone.innerHTML = "";

      matchs.forEach(match => {

        const element = document.createElement("div");

        element.className = "match";

        element.innerHTML = `

          <div class="teams">
            ⚽ ${match.teams.home.name}
            — ${match.teams.away.name}
          </div>

          <div class="status">
            🏆 ${match.league.name}
          </div>

          <button onclick="analyserMatch(
            '${match.teams.home.name.replace(/'/g, "\\'")}',
            '${match.teams.away.name.replace(/'/g, "\\'")}'
          )">
            📊 Analyser
          </button>

        `;

        zone.appendChild(element);

      });

    } catch (erreur) {

      console.error(erreur);

      zone.innerHTML =
        "<p>❌ Impossible de charger les matchs.</p>";

    }

  }


  function analyserMatch(equipeDomicile, equipeExterieure) {

    const zone = document.getElementById("matches");

    zone.innerHTML = `

      <div class="analyse">

        <h2>📊 Analyse REMIX BET</h2>

        <h3>
          ⚽ ${equipeDomicile} — ${equipeExterieure}
        </h3>

        <p>
          📈 Analyse statistique en préparation...
        </p>

        <p>
          🏠 Équipe à domicile :
          ${equipeDomicile}
        </p>

        <p>
          ✈️ Équipe extérieure :
          ${equipeExterieure}
        </p>

        <p>
          🔎 Les statistiques détaillées seront chargées prochainement.
        </p>

        <button onclick="chargerMatchs()">
          ⬅️ Retour aux matchs
        </button>

      </div>

    `;

  }

</script>

</body>
</html>
